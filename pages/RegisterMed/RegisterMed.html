<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthMap — Cadastro Médico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/design-system.css">
    <link rel="stylesheet" href="../../styles/reset.css">
    <link rel="stylesheet" href="../../styles/components.css">
    <link rel="stylesheet" href="../../styles/animations.css">
    <link rel="stylesheet" href="RegisterMed.css">
</head>

<body>
    <div class="register-page">
        <div class="register-container">
            <div class="register-header">
                <a href="../SelectLogin/SelectLogin.html" class="back-link">← Voltar</a>
                <div class="register-logo">👨‍⚕️</div>
                <h1 class="register-title">Cadastro Médico</h1>
                <p class="register-subtitle">Preencha seus dados para criar sua conta</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)" novalidate>
                <div class="input-group">
                    <label for="nome" class="input-label">Nome completo</label>
                    <input type="text" id="nome" class="input-field" placeholder="Dr. Nome completo" required>
                    <span class="input-error" id="nomeError"></span>
                </div>

                <div class="input-group">
                    <label for="email" class="input-label">E-mail</label>
                    <input type="email" id="email" class="input-field" placeholder="seu@email.com" required>
                    <span class="input-error" id="emailError"></span>
                </div>

                <div class="input-group">
                    <label for="cpf" class="input-label">CPF</label>
                    <input type="text" id="cpf" class="input-field" placeholder="000.000.000-00" required>
                    <span class="input-error" id="cpfError"></span>
                </div>

                <div class="input-group">
                    <label for="telefone" class="input-label">Telefone</label>
                    <input type="tel" id="telefone" class="input-field" placeholder="(00) 00000-0000" required>
                    <span class="input-error" id="telefoneError"></span>
                </div>

                <div class="input-group">
                    <label for="crm" class="input-label">CRM</label>
                    <input type="text" id="crm" class="input-field" placeholder="Número do CRM" required>
                    <span class="input-error" id="crmError"></span>
                </div>

                <div class="input-group">
                    <label for="especialidade" class="input-label">Especialidade</label>
                    <select id="especialidade" class="select-field" required>
                        <option value="" disabled selected>Selecione uma especialidade</option>
                        <option value="clinico">Clínico Geral</option>
                        <option value="cardiologia">Cardiologia</option>
                        <option value="dermatologia">Dermatologia</option>
                        <option value="ortopedia">Ortopedia</option>
                        <option value="pediatria">Pediatria</option>
                        <option value="neurologia">Neurologia</option>
                    </select>
                    <span class="input-error" id="especialidadeError"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg mt-md">
                    Cadastrar
                </button>
            </form>

            <div class="register-footer">
                <span>Já tem uma conta?</span>
                <a href="../LoginInicial/LoginInicial.html" class="login-link">Fazer login</a>
            </div>
        </div>
    </div>

    <script>
        function handleRegister(event) {
            event.preventDefault();

            const fields = ['nome', 'email', 'cpf', 'telefone', 'crm', 'especialidade'];
            let hasError = false;

            fields.forEach(field => {
                const input = document.getElementById(field);
                const error = document.getElementById(field + 'Error');
                error.textContent = '';
                input.classList.remove('error');

                if (!input.value.trim()) {
                    error.textContent = 'Este campo é obrigatório';
                    input.classList.add('error');
                    hasError = true;
                }
            });

            // Email validation
            const email = document.getElementById('email');
            const emailError = document.getElementById('emailError');
            if (email.value && !email.value.includes('@')) {
                emailError.textContent = 'Insira um e-mail válido';
                email.classList.add('error');
                hasError = true;
            }

            if (!hasError) {
                alert('Cadastro realizado com sucesso! (Simulação)');
                window.location.href = '../LoginInicial/LoginInicial.html';
            }
        }
    </script>
</body>

</html>
