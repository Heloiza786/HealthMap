<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedCloud — Consultas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/design-system.css">
    <link rel="stylesheet" href="../../styles/reset.css">
    <link rel="stylesheet" href="../../styles/components.css">
    <link rel="stylesheet" href="../../styles/animations.css">
    <link rel="stylesheet" href="../../styles/admin.css">
    <link rel="stylesheet" href="../Dashboard/Dashboard.css">
    <script src="../../js/data.js">
    </script>
    <script src="../../js/app.js">
    </script>
</head>

<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo">🏥 MedCloud</span>
            </div>
            <nav class="sidebar-nav">
                <a href="../Dashboard/Dashboard.html" class="sidebar-link">
                    <span>📊</span> Dashboard
                </a>
                <a href="ConsultasMed.html" class="sidebar-link active">
                    <span>📅</span> Consultas
                </a>
                <a href="../Pacientes/Pacientes.html" class="sidebar-link">
                    <span>👥</span> Pacientes
                </a>
                <a href="../PerfilMed/PerfilMed.html" class="sidebar-link">
                    <span>👤</span> Perfil
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="../LoginInicial/LoginInicial.html" class="sidebar-link" onclick="MedCloud.logout()">
                    <span>🚪</span> Sair
                </a>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <main class="dashboard-main">
            <header class="dashboard-topbar">
                <button class="btn btn-ghost menu-toggle" onclick="toggleSidebar()" aria-label="Abrir menu">☰</button>
                <div class="topbar-info">
                    <span class="topbar-greeting" id="greeting">Consultas</span>
                </div>
                <div class="topbar-actions">
                    <button class="btn btn-ghost btn-sm" onclick="toggleTheme()" aria-label="Alternar tema">🌓</button>
                    <div class="avatar" id="userAvatar">👤</div>
                </div>
            </header>

            <div class="dashboard-content page-enter">
                <div class="page-header">
                    <div>
                        <h1>Consultas</h1>
                        <p>Gerencie todas as suas consultas</p>
                    </div>
                </div>

                <!-- Filters -->
                <div class="filter-tabs" id="filterTabs">
                    <button class="filter-tab active" data-filter="all" onclick="filterConsultas('all')">Todas</button>
                    <button class="filter-tab" data-filter="futuras"
                        onclick="filterConsultas('futuras')">Futuras</button>
                    <button class="filter-tab" data-filter="concluidas"
                        onclick="filterConsultas('concluidas')">Concluídas</button>
                    <button class="filter-tab" data-filter="canceladas"
                        onclick="filterConsultas('canceladas')">Canceladas</button>
                </div>

                <!-- Date filter -->
                <div
                    style="display: flex; gap: var(--spacing-sm); align-items: center; margin-bottom: var(--spacing-lg); flex-wrap: wrap;">
                    <label class="input-label" style="margin-bottom: 0;">Filtrar por data:</label>
                    <input type="date" id="filterDataInicio" class="input-field" style="width: auto; max-width: 180px;"
                        onchange="filterConsultas(currentFilter)">
                    <span style="color: var(--color-text-muted);">até</span>
                    <input type="date" id="filterDataFim" class="input-field" style="width: auto; max-width: 180px;"
                        onchange="filterConsultas(currentFilter)">
                    <button class="btn btn-ghost btn-sm" onclick="clearDateFilter()">Limpar</button>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Horário</th>
                                <th>Paciente</th>
                                <th>Observações</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="consultasTableBody">
                            <tr>
                                <td colspan="6" class="empty-state">
                                    <div class="spinner"></div>
                                    <p>Carregando...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        let currentFilter = 'all';
        let allConsultas = [];

        document.addEventListener('DOMContentLoaded', function () {
            const user = requireAuth('medico');
            if (!user) return;

            document.getElementById('greeting').textContent = `Consultas — ${user.nome.split(' ').slice(0, 2).join(' ')}`;
            document.getElementById('userAvatar').textContent = user.nome.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();

            allConsultas = MedCloud.getConsultasByMedico(user.id)
                .sort((a, b) => b.data.localeCompare(a.data) || b.hora.localeCompare(b.hora));

            filterConsultas('all');
        });

        function filterConsultas(filter) {
            currentFilter = filter;

            // Update active tab
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.filter === filter);
            });

            let filtered = [...allConsultas];

            // Apply status filter
            if (filter === 'futuras') {
                const hoje = new Date().toISOString().split('T')[0];
                filtered = filtered.filter(c => c.data >= hoje && c.status !== 'cancelada' && c.status !== 'concluida');
            } else if (filter === 'concluidas') {
                filtered = filtered.filter(c => c.status === 'concluida');
            } else if (filter === 'canceladas') {
                filtered = filtered.filter(c => c.status === 'cancelada');
            }

            // Apply date filter
            const dataInicio = document.getElementById('filterDataInicio').value;
            const dataFim = document.getElementById('filterDataFim').value;
            if (dataInicio) {
                filtered = filtered.filter(c => c.data >= dataInicio);
            }
            if (dataFim) {
                filtered = filtered.filter(c => c.data <= dataFim);
            }

            renderConsultas(filtered);
        }

        function renderConsultas(consultas) {
            const tbody = document.getElementById('consultasTableBody');

            if (consultas.length === 0) {
                tbody.innerHTML = `
                            <tr>
                                <td colspan="6" class="empty-state">
                                    <div class="empty-icon">📅</div>
                                    <p>Nenhuma consulta encontrada.</p>
                                </td>
                            </tr>
                        `;
                return;
            }

            tbody.innerHTML = consultas.map(c => {
                const paciente = MedCloud.getPacienteById(c.pacienteId);
                const nomePac = paciente ? paciente.nome : 'Paciente';
                return `
                            <tr>
                                <td>${formatDate(c.data)}</td>
                                <td><span class="time-badge">${c.hora}</span></td>
                                <td><strong>${nomePac}</strong></td>
                                <td><span class="text-muted text-sm">${c.observacoes || '—'}</span></td>
                                <td><span class="badge ${getStatusBadgeClass(c.status)}">${getStatusLabel(c.status)}</span></td>
                                <td>
                                    <div class="table-actions">
                                        ${c.status !== 'concluida' && c.status !== 'cancelada' ? `
                                            <button class="btn btn-sm btn-ghost" onclick="concluirConsulta('${c.id}')" title="Concluir">✅</button>
                                            <button class="btn btn-sm btn-ghost" onclick="cancelarConsulta('${c.id}')" title="Cancelar">❌</button>
                                        ` : ''}
                                        ${c.status === 'pendente' ? `
                                            <button class="btn btn-sm btn-ghost" onclick="reagendar('${c.id}')" title="Reagendar">🔄</button>
                                        ` : ''}
                                    </div>
                                </td>
                            </tr>
                        `;
            }).join('');
        }

        function concluirConsulta(id) {
            const result = MedCloud.concluirConsulta(id);
            if (result.success) {
                showToast('Consulta concluída!');
                refreshData();
            }
        }

        function cancelarConsulta(id) {
            if (!confirm('Tem certeza que deseja cancelar esta consulta?')) return;
            const result = MedCloud.cancelarConsulta(id);
            if (result.success) {
                showToast('Consulta cancelada.', 'warning');
                refreshData();
            }
        }

        function reagendar(id) {
            const novaData = prompt('Nova data (AAAA-MM-DD):');
            if (!novaData) return;
            const novaHora = prompt('Novo horário (HH:MM):');
            if (!novaHora) return;

            const result = MedCloud.reagendarConsulta(id, novaData, novaHora);
            if (result.success) {
                showToast('Consulta reagendada!');
                refreshData();
            } else {
                showToast(result.error, 'error');
            }
        }

        function refreshData() {
            const user = MedCloud.getCurrentUser();
            if (user) {
                allConsultas = MedCloud.getConsultasByMedico(user.id)
                    .sort((a, b) => b.data.localeCompare(a.data) || b.hora.localeCompare(b.hora));
                filterConsultas(currentFilter);
            }
        }

        function clearDateFilter() {
            document.getElementById('filterDataInicio').value = '';
            document.getElementById('filterDataFim').value = '';
            filterConsultas(currentFilter);
        }
    </script>
</body>

</html>
