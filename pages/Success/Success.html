<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedCloud — Sucesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/design-system.css">
    <link rel="stylesheet" href="../../styles/reset.css">
    <link rel="stylesheet" href="../../styles/components.css">
    <link rel="stylesheet" href="../../styles/animations.css">
    <link rel="stylesheet" href="Success.css">
</head>

<body>
    <div class="success-page">
        <div class="success-container animate-bounce-in">
            <div class="success-icon">✅</div>
            <h1 class="success-title">Operação realizada com sucesso!</h1>
            <p class="success-text" id="successMessage">
                Sua solicitação foi processada.
            </p>
            <div class="success-actions">
                <a href="../LoginInicial/LoginInicial.html" class="btn btn-primary btn-lg">
                    Ir para o Login
                </a>
                <a href="../HomeSec/HomeSec.html" class="btn btn-secondary btn-lg">
                    Página Inicial
                </a>
            </div>
        </div>
    </div>

    <script>
        // Get message from URL
        const params = new URLSearchParams(window.location.search);
        const msg = params.get('msg');
        if (msg) {
            document.getElementById('successMessage').textContent = decodeURIComponent(msg);
        }
    </script>
</body>

</html>
